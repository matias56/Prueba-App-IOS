name: iOS Build Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     
      - name: Install dependencies
        run: npm install --legacy-peer-deps
    
      - name: Generate iOS Xcode project
        run: npx expo prebuild --platform ios
      
     