name: iOS Build Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Purge accidental Expo contamination
        run: npm uninstall expo --legacy-peer-deps

      - name: Generate Clean iOS Project
        run: |
          rm -rf ios
          npx react-native init agriFM --version 0.64.3 --skip-install
          mv agriFM/ios ./ios
          rm -rf agriFM

      - name: Bump minimum iOS version to 13.0
        run: |
          sed -i '' "s/platform :ios, .*/platform :ios, '13.0'/g" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/agriFM.xcodeproj/project.pbxproj

      - name: Disable Flipper (Fixes Flipper-Glog bug)
        run: sed -i '' 's/use_flipper!/# use_flipper!/g' ios/Podfile

      - name: Force all Native Pods to iOS 13.0
        run: |
          ruby -e "
          file = 'ios/Podfile'
          content = File.read(file)
          hook = %q{
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end
            end
          }
          content.sub!('react_native_post_install(installer)', %Q{react_native_post_install(installer)\n#{hook}})
          File.write(file, content)
          "

      - name: Completely Overwrite glog configuration
        run: |
          cat << 'EOF' > node_modules/react-native/scripts/ios-configure-glog.sh
          #!/bin/bash
          set -e
          
          # 1. Destroy the poisoned CocoaPods environment variables
          unset CC CXX CFLAGS CXXFLAGS LDFLAGS
          
          # 2. Force modern 64-bit architecture
          export CC="$(xcrun -find -sdk iphoneos cc) -arch arm64 -isysroot $(xcrun -sdk iphoneos --show-sdk-path)"
          export CXX="$CC"
          export CFLAGS="-arch arm64"
          export CXXFLAGS="-arch arm64"
          export LDFLAGS="-arch arm64"
          
          if [ -h "test-driver" ]; then
              rm test-driver
          fi
          
          # 3. Safely download modern Apple Silicon configs
          curl -sfL -o config.sub 'https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub'
          curl -sfL -o config.guess 'https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess'
          chmod +x config.sub config.guess
          
          # 4. Configure with the correct Apple Silicon host
          ./configure --host=arm64-apple-darwin
          
          # 5. Copy the required headers back to React Native
          EXPORTED_INCLUDE_DIR="exported/glog"
          mkdir -p exported/glog
          cp -f src/glog/log_severity.h "$EXPORTED_INCLUDE_DIR/"
          cp -f src/glog/logging.h "$EXPORTED_INCLUDE_DIR/"
          cp -f src/glog/raw_logging.h "$EXPORTED_INCLUDE_DIR/"
          cp -f src/glog/stl_logging.h "$EXPORTED_INCLUDE_DIR/"
          cp -f src/glog/vlog_is_on.h "$EXPORTED_INCLUDE_DIR/"
          EOF
          chmod +x node_modules/react-native/scripts/ios-configure-glog.sh

      - name: Patch Yoga for modern C++ compilers
          # Fixes both the deprecated space in literal operators AND the bitwise boolean crash
        run: |
            sed -i '' 's/operator"" _/operator""_/g' node_modules/react-native/ReactCommon/yoga/yoga/YGValue.h
            sed -i '' 's/hadOverflow() |/hadOverflow() ||/g' node_modules/react-native/ReactCommon/yoga/yoga/Yoga.cpp

      - name: Clear Poisoned CocoaPods Cache
        run: rm -rf ~/Library/Caches/CocoaPods

      - name: Install iOS Pods (Native Dependencies)
        working-directory: ./ios
        run: pod install

      - name: Build the app
        working-directory: ./ios
        run: |
          xcodebuild build \
            -workspace 'agriFM.xcworkspace' \
            -scheme 'agriFM' \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED='NO'
      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
         name: agriFM-Simulator-App
         path: ios/build/Build/Products/Debug-iphonesimulator/agriFM.app