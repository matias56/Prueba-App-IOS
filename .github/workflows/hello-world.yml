name: iOS Build Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

     
      - name: Install dependencies
        run: npm install --legacy-peer-deps
    
    
      
      - name: Build the app
        working-directory: node_modules/react-native/template/ios/HelloWorld.xcodeproj


        run: |
          xcodebuild build \
            -scheme 'Prueba-App-IOS' \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 15' \
            CODE_SIGNING_ALLOWED='NO'