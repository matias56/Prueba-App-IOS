name: iOS Build Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Purge accidental Expo contamination
        run: npm uninstall expo --legacy-peer-deps

      - name: Generate Clean iOS Project
        run: |
          rm -rf ios
          npx react-native init agriFM --version 0.64.3 --skip-install
          mv agriFM/ios ./ios
          rm -rf agriFM

      - name: Bump minimum iOS version to 13.0
        run: sed -i '' "s/platform :ios, .*/platform :ios, '13.0'/g" ios/Podfile

      - name: Disable Flipper (Fixes Flipper-Glog bug)
        run: sed -i '' 's/use_flipper!/# use_flipper!/g' ios/Podfile

      - name: Patch core glog for modern Xcode
        # Destroys CocoaPods' 32-bit environment variables before safely stripping the script
        run: |
          echo '#!/bin/bash' > clean_glog.sh
          echo 'unset CC CXX CFLAGS CXXFLAGS LDFLAGS' >> clean_glog.sh
          tail -n +2 node_modules/react-native/scripts/ios-configure-glog.sh >> clean_glog.sh
          
          sed -i '' -e 's/-arch armv7s//g' -e 's/-arch armv7//g' -e 's/-arch i386//g' clean_glog.sh
          sed -i '' 's/arm-apple-darwin/arm64-apple-darwin/g' clean_glog.sh
          
          mv clean_glog.sh node_modules/react-native/scripts/ios-configure-glog.sh
          chmod +x node_modules/react-native/scripts/ios-configure-glog.sh

      - name: Install iOS Pods (Native Dependencies)
        working-directory: ./ios
        run: pod install

      - name: Build the app
        working-directory: ./ios
        run: |
          xcodebuild build \
            -workspace 'agriFM.xcworkspace' \
            -scheme 'agriFM' \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED='NO'